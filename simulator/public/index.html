<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Web</title>
  <link rel="icon" href="assets/avatars/user1.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/whatsapp.css">
</head>
<body>

  <!-- ==============================================================================
       WHATSAPP WEB TWO-COLUMN APPLICATION CONTAINER
       ============================================================================== -->
  <main class="whatsapp-app">

    <!-- LEFT SIDEBAR: CHAT THREADS & CONTACTS -->
    <aside class="sidebar">
      <!-- Sidebar Header -->
      <div class="sidebar-header">
        <div class="user-profile" title="Profile">
          <div class="avatar-container">
            <img src="assets/avatars/my_avatar.svg" alt="Profile">
          </div>
        </div>

        <div class="sidebar-actions">
          <button type="button" class="icon-btn" title="Communities">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
            </svg>
          </button>
          <button type="button" class="icon-btn" title="Status">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
            </svg>
          </button>
          <button type="button" class="icon-btn" title="Channels">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2zm-2 1H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6z"/>
            </svg>
          </button>
          <!-- New Chat Button (+) -->
          <button type="button" class="icon-btn" id="btnNewChat" title="New chat">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
            </svg>
          </button>
          <div class="menu-dropdown-container">
            <button type="button" class="icon-btn" id="btnSidebarMenu" title="Menu">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
              </svg>
            </button>
            <div class="dropdown-menu" id="sidebarMenu">
              <div class="dropdown-item" id="menuNewGroup">New group</div>
              <div class="dropdown-item" id="menuNewChatOption">New chat</div>
              <div class="dropdown-item" id="menuToggleTheme">Toggle Theme (Dark / Light)</div>
              <div class="dropdown-item" id="menuToggleSender">Switch Active Sender (Alt+S)</div>
              <div class="dropdown-divider"></div>
              <div class="dropdown-item">Starred messages</div>
              <div class="dropdown-item">Settings</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Search & Filter Bar -->
      <div class="search-container">
        <div class="search-input-box">
          <span class="search-icon">🔍</span>
          <input type="text" class="search-input" id="searchChatInput" placeholder="Search or start new chat">
        </div>
        <button type="button" class="btn-filter-unread" title="Filter unread chats">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/>
          </svg>
        </button>
      </div>

      <!-- Contact List -->
      <div class="chat-list" id="chatList">
        <!-- Rendered by app.js -->
      </div>
    </aside>

    <!-- RIGHT MAIN CHAT WINDOW -->
    <section class="chat-window" id="chatWindow">
      <!-- Background Doodle Wallpaper -->
      <div class="chat-wallpaper"></div>

      <!-- Chat Header -->
      <header class="chat-header">
        <div class="chat-header-info">
          <div class="avatar-container">
            <img src="assets/avatars/user1.svg" alt="Avatar" id="chatHeaderAvatar">
          </div>
          <div class="chat-header-text">
            <span class="chat-header-title" id="chatHeaderTitle">Aryan Kapoor</span>
            <span class="chat-header-subtitle" id="chatHeaderSubtitle">online</span>
          </div>
        </div>

        <div class="chat-header-actions">
          <button type="button" class="icon-btn" title="Search...">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
            </svg>
          </button>
          <button type="button" class="icon-btn" title="Menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- Messages Area -->
      <div class="messages-container" id="messagesContainer">
        <!-- Rendered by app.js -->
      </div>

      <!-- Drag & Drop Zone Overlay -->
      <div class="drag-drop-overlay" id="dragDropOverlay">
        <svg width="60" height="60" viewBox="0 0 24 24" fill="#00a884">
          <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
        </svg>
        <span class="drag-drop-title">Drop file to attach to chat</span>
      </div>

      <!-- Attachment Popup Menu -->
      <div class="attachment-popup" id="attachmentPopup">
        <button type="button" class="attach-option-btn" id="btnAttachPhoto">
          <div class="attach-icon-circle" style="background: linear-gradient(135deg, #ac44cf, #7f229b);">🖼️</div>
          <span>Photos & Videos</span>
        </button>
        <button type="button" class="attach-option-btn" id="btnAttachDoc">
          <div class="attach-icon-circle" style="background: linear-gradient(135deg, #5f66cd, #494ea3);">📄</div>
          <span>Document</span>
        </button>
        <button type="button" class="attach-option-btn" id="btnAttachPoll">
          <div class="attach-icon-circle" style="background: linear-gradient(135deg, #02a3a4, #00796b);">📊</div>
          <span>Poll</span>
        </button>
        <button type="button" class="attach-option-btn" id="btnAttachPresetQR">
          <div class="attach-icon-circle" style="background: linear-gradient(135deg, #007bfc, #0056b3);">📷</div>
          <span>Payment QR Code</span>
        </button>
      </div>

      <!-- Emoji Picker Drawer -->
      <div class="emoji-drawer" id="emojiDrawer">
        <div class="emoji-drawer-header">
          <div class="emoji-search-box">
            <span>🔍</span>
            <input type="text" id="emojiSearchInput" placeholder="Search emoji">
          </div>
        </div>
        <div class="emoji-categories-nav" id="emojiCategoryNav">
          <button type="button" class="emoji-cat-btn active" data-cat="smileys">😀</button>
          <button type="button" class="emoji-cat-btn" data-cat="gestures">👍</button>
          <button type="button" class="emoji-cat-btn" data-cat="slang">💊</button>
          <button type="button" class="emoji-cat-btn" data-cat="food">🍕</button>
          <button type="button" class="emoji-cat-btn" data-cat="activities">⚽</button>
          <button type="button" class="emoji-cat-btn" data-cat="symbols">❤️</button>
        </div>
        <div class="emoji-grid-container" id="emojiGrid">
          <!-- Populated by app.js -->
        </div>
      </div>

      <!-- Bottom Chat Bar -->
      <footer class="chat-bottom-bar" id="chatFooter">
        
        <!-- Standard Input Footer Row -->
        <div class="footer-row" id="footerNormalRow">
          <div class="input-actions-left">
            <!-- Emoji Trigger -->
            <button type="button" class="icon-btn" id="btnEmoji" title="Emoji">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                <path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/>
              </svg>
            </button>

            <!-- Attachment Trigger (Paperclip) -->
            <button type="button" class="icon-btn" id="attachmentBtn" title="Attach">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                <path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/>
              </svg>
            </button>
          </div>

          <!-- Chat Input Container (Includes Attachment Preview Card) -->
          <div class="chat-input-wrapper-card" id="chatInputCard">
            <!-- Attachment Preview Card (Thumbnail / Doc icon + File name + Remove button) -->
            <div class="attachment-preview-card" id="attachmentPreviewCard">
              <div class="preview-media-box" id="previewMediaBox">
                <!-- Preview image or document icon rendered here -->
              </div>
              <div class="preview-info-box">
                <span class="preview-filename" id="previewFileName">filename.png</span>
                <span class="preview-filesize" id="previewFileSize">24 KB</span>
              </div>
              <button type="button" class="btn-remove-attachment" id="btnRemoveAttachment" title="Remove attachment">×</button>
            </div>

            <!-- Text Input Field -->
            <div class="chat-input-row">
              <textarea
                class="chat-input"
                id="chatInput"
                rows="1"
                placeholder="Type a message"
              ></textarea>
            </div>
          </div>

          <!-- Discreet Sender Switch Button (Allows toggling typing as Contact vs You) -->
          <button type="button" class="icon-btn sender-mode-btn" id="btnSenderSwitch" title="Switch Sender: Incoming (Contact) / Outgoing (You) [Alt+S]">
            <span id="senderModeIndicator">👤</span>
          </button>

          <!-- Voice Note Button (Microphone) -->
          <button type="button" class="icon-btn" id="btnVoiceNote" title="Voice message">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
            </svg>
          </button>

          <!-- Send Button -->
          <button type="button" class="btn-send" id="btnSend" title="Send message" style="display: none;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
          </button>
        </div>

        <!-- Voice Note Recording Bar (Replaces Input Row when Recording) -->
        <div class="recording-bar" id="recordingBar" style="display: none;">
          <div class="recording-left">
            <button type="button" class="icon-btn btn-trash-record" id="btnCancelRecording" title="Cancel recording">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
              </svg>
            </button>
            <div class="record-pulse-dot"></div>
            <span class="recording-timer" id="recordingTimer">0:00</span>
          </div>

          <div class="recording-waveform" id="recordingWaveform">
            <span class="wave-bar"></span>
            <span class="wave-bar"></span>
            <span class="wave-bar"></span>
            <span class="wave-bar"></span>
            <span class="wave-bar"></span>
            <span class="wave-bar"></span>
            <span class="wave-bar"></span>
            <span class="wave-bar"></span>
          </div>

          <div class="recording-right">
            <button type="button" class="btn-send btn-send-audio" id="btnSendRecording" title="Send voice note">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
              </svg>
            </button>
          </div>
        </div>

      </footer>
    </section>

  </main>

  <!-- ==============================================================================
       MODALS & DIALOGS
       ============================================================================== -->

  <!-- 1. NEW GROUP MODAL -->
  <div class="wa-modal-backdrop" id="modalNewGroup">
    <div class="wa-modal-card">
      <div class="wa-modal-header">
        <button type="button" class="icon-btn btn-close-wa-modal" id="btnCloseGroupModal">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
        <span class="wa-modal-title">New group</span>
      </div>

      <div class="wa-modal-body">
        <!-- Selected contacts chips -->
        <div class="selected-chips-container" id="selectedGroupChips"></div>

        <!-- Group Name / Subject -->
        <div class="group-subject-row">
          <div class="group-avatar-placeholder">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
          </div>
          <div class="group-input-box">
            <input type="text" id="groupSubjectInput" placeholder="Group subject (required)" maxlength="25">
            <span class="char-counter" id="groupCharCounter">25</span>
          </div>
        </div>

        <div class="modal-section-label">Select group members</div>

        <!-- Contacts with checkboxes -->
        <div class="modal-contacts-list" id="groupContactsList">
          <!-- Populated by app.js -->
        </div>
      </div>

      <div class="wa-modal-footer">
        <button type="button" class="btn-modal-action-fab" id="btnCreateGroupSubmit" title="Create group">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- 2. NEW CHAT MODAL -->
  <div class="wa-modal-backdrop" id="modalNewChat">
    <div class="wa-modal-card">
      <div class="wa-modal-header">
        <button type="button" class="icon-btn btn-close-wa-modal" id="btnCloseChatModal">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
        <span class="wa-modal-title">New chat</span>
      </div>

      <div class="wa-modal-body">
        <div class="simple-input-group">
          <label for="newChatName">Contact Name</label>
          <input type="text" id="newChatName" placeholder="e.g. Alex Johnson" required>
        </div>
        <div class="simple-input-group">
          <label for="newChatPhone">Phone Number</label>
          <input type="text" id="newChatPhone" placeholder="e.g. +91 98765 43210" required>
        </div>
      </div>

      <div class="wa-modal-footer" style="padding: 16px 24px;">
        <button type="button" class="btn-wa-primary" id="btnCreateChatSubmit">Start Chat</button>
      </div>
    </div>
  </div>

  <!-- 3. POLL CREATION MODAL -->
  <div class="wa-modal-backdrop" id="modalPoll">
    <div class="wa-modal-card" style="max-width: 440px;">
      <div class="wa-modal-header">
        <button type="button" class="icon-btn btn-close-wa-modal" id="btnClosePollModal">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
        <span class="wa-modal-title">Create a poll</span>
      </div>

      <div class="wa-modal-body">
        <div class="simple-input-group">
          <label for="pollQuestion">Question</label>
          <input type="text" id="pollQuestion" placeholder="Ask question..." required>
        </div>

        <div class="poll-options-group">
          <label>Options</label>
          <div id="pollOptionsContainer">
            <input type="text" class="poll-option-input" placeholder="Option 1" value="Yes, confirmed">
            <input type="text" class="poll-option-input" placeholder="Option 2" value="No, reschedule">
          </div>
          <button type="button" class="btn-add-poll-option" id="btnAddPollOption">+ Add option</button>
        </div>

        <div class="poll-switch-row">
          <span>Allow multiple answers</span>
          <label class="wa-switch">
            <input type="checkbox" id="pollMultipleAnswers">
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="wa-modal-footer" style="padding: 16px 24px;">
        <button type="button" class="btn-wa-primary" id="btnSubmitPoll">Create Poll</button>
      </div>
    </div>
  </div>

  <!-- Hidden Inputs for Files -->
  <input type="file" id="fileInputPhoto" accept="image/*,video/*" style="display: none;">
  <input type="file" id="fileInputDoc" accept=".pdf,.doc,.docx,.txt,.csv,.xlsx,.zip,*/*" style="display: none;">

  <!-- Evidence Image Lightbox Modal -->
  <div class="image-modal" id="imageModal">
    <div class="image-modal-content">
      <button type="button" class="btn-close-modal" id="btnCloseModal">×</button>
      <img src="" alt="Media" id="modalImg">
      <div class="image-modal-caption" id="modalCaption"></div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/threat_engine.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
