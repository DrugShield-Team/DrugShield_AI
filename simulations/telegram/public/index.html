<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telegram Web</title>
  <link rel="icon" href="assets/avatars/analyst.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/telegram.css">
</head>
<body>

  <!-- MAIN TELEGRAM APP CONTAINER -->
  <main class="telegram-app">

    <!-- LEFT SIDEBAR -->
    <aside class="tg-sidebar">
      <!-- Top Search & Menu (Authentic Telegram 3-Bar Burger) -->
      <div class="tg-sidebar-header">
        <button type="button" class="tg-btn-burger" id="btnBurger" title="Open Menu">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
          </svg>
        </button>
        <div class="tg-search-box">
          <span class="tg-search-icon">🔍</span>
          <input type="text" class="tg-search-input" id="tgSearchInput" placeholder="Search">
        </div>
      </div>

      <!-- Folder Tabs -->
      <div class="tg-folder-tabs">
        <button type="button" class="tg-tab-btn active" data-tab="all">All</button>
        <button type="button" class="tg-tab-btn" data-tab="channels">Channels</button>
        <button type="button" class="tg-tab-btn" data-tab="groups">Groups</button>
        <button type="button" class="tg-tab-btn" data-tab="direct">Personal</button>
      </div>

      <!-- Chat List -->
      <div class="tg-chat-list" id="tgChatList"></div>
    </aside>

    <!-- RIGHT MAIN CHAT AREA -->
    <section class="tg-main-chat">
      <div class="tg-wallpaper"></div>

      <!-- Header (Authentic Telegram Web Header) -->
      <header class="tg-chat-header">
        <div class="tg-header-left" id="tgHeaderProfile">
          <div class="tg-avatar-wrap" id="tgChatHeaderAvatar" style="width: 42px; height: 42px; font-size: 15px;">
            BP
          </div>
          <div class="tg-header-meta">
            <span class="tg-header-name" id="tgChatHeaderName">
              BLR Party Supplies
              <span class="tg-badge-verified">★</span>
            </span>
            <span class="tg-header-status" id="tgChatHeaderStatus">2,840 subscribers</span>
          </div>
        </div>

        <div class="tg-header-actions">
          <button type="button" class="tg-icon-btn" id="tgHeaderSearch" title="Search messages">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
            </svg>
          </button>
          
          <button type="button" class="tg-icon-btn" id="tgHeaderMore" title="More options">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
            </svg>
          </button>

          <!-- Authentic Dropdown Menu -->
          <div class="tg-menu-dropdown" id="tgMoreDropdown">
            <div class="tg-dropdown-item" id="menuTogglePersona">
              <span>🎭</span> Switch to Analyst View
            </div>
            <div class="tg-dropdown-item" id="menuMute">
              <span>🔔</span> Mute Notifications
            </div>
            <div class="tg-dropdown-item" id="menuClearChat">
              <span>🗑️</span> Clear History
            </div>
          </div>
        </div>
      </header>

      <!-- Messages Container -->
      <div class="tg-messages-scroll" id="tgMessagesScroll"></div>

      <!-- Attachment Preview Bar -->
      <div class="tg-attach-preview" id="tgAttachPreview">
        <img src="" alt="Thumbnail" class="tg-preview-thumb" id="tgPreviewThumb">
        <div class="tg-preview-info">
          <div class="tg-preview-title" id="tgPreviewTitle">attachment.png</div>
        </div>
        <button type="button" class="tg-btn-remove-attach" id="tgBtnRemoveAttach" title="Remove">✕</button>
      </div>

      <!-- Authentic Input Bar with Native Emoji Support -->
      <div class="tg-input-bar">
        <!-- Emoji Button -->
        <button type="button" class="tg-icon-btn" id="tgBtnEmoji" title="Emoji & Stickers">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/>
          </svg>
        </button>

        <!-- Interactive Emoji Picker Popover -->
        <div class="tg-emoji-picker" id="tgEmojiPicker">
          <div class="tg-emoji-tabs">
            <button class="tg-emoji-tab active" data-tab="smileys" title="Smileys">😀</button>
            <button class="tg-emoji-tab" data-tab="threat" title="Contraband & OSINT">💊</button>
            <button class="tg-emoji-tab" data-tab="objects" title="Objects & Payments">💳</button>
            <button class="tg-emoji-tab" data-tab="symbols" title="Symbols">⚡</button>
          </div>
          <div class="tg-emoji-grid" id="tgEmojiGrid"></div>
        </div>

        <!-- Input Field Wrap -->
        <div class="tg-input-field-wrap">
          <input type="text" class="tg-msg-input" id="tgMessageInput" placeholder="Write a message...">
        </div>

        <!-- Attachment Paperclip Button -->
        <button type="button" class="tg-icon-btn" id="tgBtnAttach" title="Attach file or photo">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/>
          </svg>
        </button>
        <input type="file" id="tgFileInput" accept="image/*,.pdf,.doc,.docx,.txt" style="display: none;">

        <!-- Send Button -->
        <button type="button" class="tg-btn-send" id="tgBtnSend" title="Send (Enter)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </div>
    </section>

  </main>

  <!-- AUTHENTIC TELEGRAM SLIDE-OUT DRAWER -->
  <div class="tg-drawer-backdrop" id="tgDrawerBackdrop"></div>
  <aside class="tg-drawer" id="tgDrawer">
    <div class="tg-drawer-header">
      <div class="tg-drawer-avatar">AK</div>
      <div class="tg-drawer-name" id="drawerUserName">Aryan (Target Suspect)</div>
      <div class="tg-drawer-phone">+91 98765 43210</div>
    </div>
    <div class="tg-drawer-menu">
      <div class="tg-drawer-item" id="drawerNewChannel">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9v-2h2v2zm0-4H9V7h2v5z"/></svg>
        <span>New Channel</span>
      </div>
      <div class="tg-drawer-item" id="drawerNewGroup">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
        <span>New Group</span>
      </div>
      <div class="tg-drawer-divider"></div>
      <div class="tg-drawer-item" id="drawerTogglePersona">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        <span id="drawerPersonaText">Switch to Analyst Mode</span>
      </div>
      <div class="tg-drawer-item" id="drawerNightMode">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>
        <span>Night Mode</span>
      </div>
    </div>
  </aside>

  <!-- MODAL: DYNAMIC TARGET CHANNEL / GROUP CREATION -->
  <div class="tg-drawer-backdrop" id="modalCreateChatBackdrop"></div>
  <div class="modal-backdrop" id="modalCreateChat">
    <div class="modal-card">
      <div class="modal-header">
        <span class="modal-title">New Channel or Group</span>
        <button type="button" class="modal-close" id="btnCloseCreateChat">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">Type</label>
          <select class="form-select" id="createChatType">
            <option value="channel" selected>Broadcast Channel</option>
            <option value="group">Discussion Group</option>
            <option value="private">Direct Contact</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Title</label>
          <input type="text" class="form-input" id="createChatTitle" placeholder="e.g. NCR Drops & Supplies" required>
        </div>
        <div class="form-group">
          <label class="form-label">Handle / Username</label>
          <input type="text" class="form-input" id="createChatUsername" placeholder="e.g. @ncr_drops_bot">
        </div>
        <div class="form-group">
          <label class="form-label">Associated Phone</label>
          <input type="text" class="form-input" id="createChatPhone" placeholder="e.g. +91 98765 43210">
        </div>
        <div class="form-group">
          <label class="form-label" for="createChatLocality">Simulated locality</label>
          <select class="form-select" id="createChatLocality"><option>Jayanagar</option><option>Indiranagar</option><option>Whitefield</option><option>Rajajinagar</option><option>Yelahanka</option><option>Vijayanagar</option></select>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-secondary" id="btnCancelCreateChat">Cancel</button>
        <button type="button" class="btn-primary" id="btnSubmitCreateChat">Create</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/local_store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/telegram.js"></script>
</body>
</html>
